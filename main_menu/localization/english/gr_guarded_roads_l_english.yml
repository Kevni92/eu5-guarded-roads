l_english:
 gr_guarded_gravel_roads: "Escort House"
 gr_guarded_gravel_roads_desc: "From the Escort House, armed escorts, watchmen and mounted guards secure the roads and accompany merchants, messengers and travelers through dangerous stretches of country."
 gr_guarded_paved_roads: "Guardhouse"
 gr_guarded_paved_roads_desc: "The Guardhouse serves as a permanent base for road guards who watch routes, bridges and stopping places and protect travelers from attack."
 gr_guarded_modern_roads: "Patrol Barracks"
 gr_guarded_modern_roads_desc: "Professional detachments based at the Patrol Barracks conduct regular road patrols, secure important connections and keep lines of communication open between settlements."
 gr_guarded_rail_network: "Railway Guardhouse"
 gr_guarded_rail_network_desc: "The Railway Guardhouse protects tracks, stations and key junctions, watches over traffic and maintains security along the new arteries of transport."

 gr_guarded_gravel_roads_maintenance: "Escort House Upkeep"
