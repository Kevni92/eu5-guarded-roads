l_german:
 gr_guarded_gravel_roads: "Geleithaus"
 gr_guarded_gravel_roads_desc: "Vom Geleithaus aus sichern bewaffnete Begleiter, Wachposten und Reiter die Straßen und begleiten Händler, Boten und Reisende durch unsichere Landstriche."
 gr_guarded_paved_roads: "Wachhaus"
 gr_guarded_paved_roads_desc: "Das Wachhaus dient als fester Stützpunkt für Straßenwachen, die Wege, Brücken und Rastplätze überwachen und Reisende vor Überfällen schützen."
 gr_guarded_modern_roads: "Patrouillenkaserne"
 gr_guarded_modern_roads_desc: "Von der Patrouillenkaserne aus versehen professionelle Abteilungen regelmäßigen Straßendienst, sichern wichtige Verbindungen und halten Meldelinien zwischen den Orten offen."
 gr_guarded_rail_network: "Bahnwache"
 gr_guarded_rail_network_desc: "Die Bahnwache schützt Gleise, Bahnhöfe und wichtige Knotenpunkte, überwacht den Verkehr und stellt die Sicherheit entlang der neuen Verkehrsadern sicher."

